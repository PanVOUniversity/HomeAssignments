name: cheks

on:
  push:
    branches:
      - HomeAssignments
  pull_request:
    branches:
      - HomeAssignments
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make imagemagick

    - name: Clean
      run: make clean

    - name: Build
      run: make

    - name: Run and verify outputs
      run: |
        ./start
        ls -l cwrotated.raw ccwrotated.raw gaussian_blurred.raw

    - name: Verify image output with ImageMagick
      run: |
        convert -size 512x512 -depth 8 gray:gaussian_blurred.raw gaussian_blurred_check.png
        ls -l gaussian_blurred_check.png

    - name: Display build success message
      run: echo "C++ project built and tested successfully!"
